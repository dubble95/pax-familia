name: Build Windows Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'clients/windows/**'
      - 'shared/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

jobs:
  build-installer:
    name: Build PaxFamilia Windows Installer (.exe & .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Agent Executable
        shell: pwsh
        run: |
          mkdir bin -ErrorAction SilentlyContinue
          go build -ldflags "-H=windowsgui -s -w" -o bin/pax-winagent.exe ./clients/windows

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          cd clients/windows
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          Move-Item PaxFamiliaSetup.exe ../../bin/ -Force

      - name: Create Portable Installer ZIP
        shell: pwsh
        run: |
          $distDir = "dist\PaxFamilia-Windows-v1.0"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          Copy-Item bin\pax-winagent.exe $distDir\ -Force
          Copy-Item bin\PaxFamiliaSetup.exe $distDir\ -Force
          Copy-Item clients\windows\install.bat $distDir\ -Force
          Copy-Item clients\windows\install.ps1 $distDir\ -Force
          Copy-Item clients\windows\uninstall.bat $distDir\ -Force
          Copy-Item clients\windows\README.txt $distDir\ -Force
          Compress-Archive -Path "$distDir\*" -DestinationPath "bin\PaxFamilia-Windows-Setup-v1.0.zip" -Force

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PaxFamilia-Windows-Setup-Exe
          path: bin/PaxFamiliaSetup.exe
          retention-days: 14

      - name: Upload Windows Full Package (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: PaxFamilia-Windows-Package-Zip
          path: bin/PaxFamilia-Windows-Setup-v1.0.zip
          retention-days: 14
