# 🕊️ PaxFamilia Fly.io Configuration
# Tokyo(nrt) 리전 무료 티어 운영 (한국 지연시간 ~25ms)
# 1GB 영구 디스크 볼륨(pax_data)으로 상태 영구 보존

app = "pax-familia"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_PATH = "/app/data/pax_state.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 2000
    soft_limit = 1500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/status"

[[mounts]]
  source = "pax_data"
  destination = "/app/data"
  initial_size = "1gb"
